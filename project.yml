name: Mira
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  MiraKit:
    path: Packages/MiraKit
  SwiftStreamingMarkdown:
    path: Vendor/SwiftStreamingMarkdown
targets:
  Mira:
    type: application
    platform: macOS
    sources:
      - Apps/MiraMac
    info:
      path: Apps/MiraMac/App/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMultipleInstancesProhibited: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Mira contributors"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: MiraAppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.alwynou.mira
        PRODUCT_NAME: Mira
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: MiraKit
        product: MiraCore
      - package: MiraKit
        product: MiraData
      - package: MiraKit
        product: MiraProviders
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
  MiraHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Apps/MiraMac/Localization
      - Apps/MiraMac/Resources/Localizable.xcstrings
      - Tests/MiraLocalizationTests
      - Tests/MiraPlatformTests
      - Apps/MiraMac/Platform/Keychain
      - Apps/MiraMac/Presentation/ConversationStreamBuffer.swift
      - Apps/MiraMac/Presentation/TranscriptScrollState.swift
      - Apps/MiraMac/Presentation/TranscriptFollowScheduler.swift
      - Apps/MiraMac/Presentation/TranscriptScrollAnimation.swift
      - Apps/MiraMac/Presentation/MemoryModel.swift
      - Apps/MiraMac/Presentation/KnowledgeModel.swift
      - Apps/MiraMac/Presentation/SourceCitationModel.swift
      - Apps/MiraMac/Features/Conversation/UsageCostView.swift
      - Vendor/SwiftStreamingMarkdown/Tests/SwiftStreamingMarkdownLocaleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alwynou.mira.host-tests
    dependencies:
      - package: MiraKit
        product: MiraCore
      - package: MiraKit
        product: MiraData
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
schemes:
  Mira:
    build:
      targets:
        Mira: all
    run:
      config: Debug
    test:
      targets: [MiraHostTests]
    archive:
      config: Release
