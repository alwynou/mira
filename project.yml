name: Mira
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
  MiraKit:
    path: Packages/MiraKit
  MarkdownView:
    path: Vendor/MarkdownView
  ListViewKit:
    path: Vendor/ListViewKit
  Litext:
    url: https://github.com/Lakr233/Litext
    revision: 130b4eef642d76a3d2dcf07ab966f32f08e14b90
targets:
  Mira:
    type: application
    platform: macOS
    sources:
      - Apps/MiraMac
    info:
      path: Apps/MiraMac/App/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMultipleInstancesProhibited: true
        NSPrincipalClass: NSApplication
        NSAutoFillRequiresTextContentTypeForOneTimeCodeOnMac: true
        NSHumanReadableCopyright: "Copyright © 2026 Mira contributors"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: MiraAppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.alwynou.mira
        PRODUCT_NAME: Mira
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXEmbedders
      - package: MLXLM
        product: MLXLMCommon
      - package: Transformers
        product: Tokenizers
      - package: MiraKit
        product: MiraCore
      - package: MiraKit
        product: MiraData
      - package: MiraKit
        product: MiraProviders
      - package: MarkdownView
        product: MarkdownView
      - package: MarkdownView
        product: MarkdownParser
      - package: ListViewKit
        product: ListViewKit
      - package: Litext
        product: Litext
  MiraCompositionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Apps/MiraMac/Composition/AppContainer.swift
      - Apps/MiraMac/Composition/MacDemoModule.swift
      - Apps/MiraMac/Composition/MacBenchmarkModule.swift
      - Apps/MiraMac/App/MiraAppDelegate.swift
      - Apps/MiraMac/App/LibraryStartupView.swift
      - Apps/MiraMac/App/MiraWindowShell.swift
      - Apps/MiraMac/Performance
      - Apps/MiraMac/Composition/MacLibrary.swift
      - Apps/MiraMac/Composition/MacLibraryStorage.swift
      - Apps/MiraMac/Composition/MacLibraryRestoration.swift
      - Apps/MiraMac/Composition/MacLibrarySelection.swift
      - Apps/MiraMac/Composition/MacLibraryDiagnostics.swift
      - Apps/MiraMac/Composition/MacLibraryWorkloads.swift
      - Apps/MiraMac/Composition/MacConnectionTestService.swift
      - Apps/MiraMac/Platform/Keychain
      - Apps/MiraMac/Platform/MemoryEmbedding
      - Apps/MiraMac/Platform/Notifications/MacLocalNotifications.swift
      - Apps/MiraMac/Platform/Notifications/MacNotificationRetirement.swift
      - Apps/MiraMac/Presentation/WorkspaceEditorModel.swift
      - Apps/MiraMac/Presentation/MacSessionReadModel.swift
      - Apps/MiraMac/Presentation/SourceCitationModel.swift
      - Apps/MiraMac/Presentation/MemoryCitationModel.swift
      - Apps/MiraMac/Presentation/MemoryEditorModel.swift
      - Apps/MiraMac/Presentation/MemoryManagementModel.swift
      - Apps/MiraMac/Presentation/MemorySettingsModel.swift
      - Apps/MiraMac/Presentation/DataSettingsModel.swift
      - Apps/MiraMac/Presentation/ProviderConnectionTestModel.swift
      - Apps/MiraMac/Presentation/ProviderLibraryModel.swift
      - Apps/MiraMac/Presentation/ProviderConnectionSettingsModel.swift
      - Apps/MiraMac/Presentation/PoolModelEditorModel.swift
      - Apps/MiraMac/Presentation/PurposeRoutingModel.swift
      - Apps/MiraMac/Features/Settings/DataSettingsView.swift
      - Apps/MiraMac/Features/Memory/MemoryEditorView.swift
      - Apps/MiraMac/Features/Memory/MemoryManagementView.swift
      - Apps/MiraMac/Features/Memory/MemoryManagementDetail.swift
      - Apps/MiraMac/Features/Settings/MemorySettingsView.swift
      - Apps/MiraMac/Features/Settings/MiraSettingsLink.swift
      - Apps/MiraMac/Features/Conversation/RuntimeApprovalView.swift
      - Apps/MiraMac/Features/Conversation/ConversationView.swift
      - Apps/MiraMac/Features/Conversation/ConversationTranscript.swift
      - Apps/MiraMac/Features/Conversation/NativeConversationTranscript.swift
      - Apps/MiraMac/Presentation/TranscriptViewportLayout.swift
      - Apps/MiraMac/Presentation/TranscriptFollowScheduler.swift
      - Apps/MiraMac/Features/Knowledge/KnowledgeCitationView.swift
      - Apps/MiraMac/Features/Memory/MemoryCitationView.swift
      - Apps/MiraMac/Features/Conversation/ExecutionInspector.swift
      - Apps/MiraMac/Features/Conversation/MemoryExtractionInspector.swift
      - Apps/MiraMac/Presentation/ConversationModel.swift
      - Apps/MiraMac/Presentation/ConversationModelPreferences.swift
      - Apps/MiraMac/Presentation/ConversationPageState.swift
      - Apps/MiraMac/Presentation/ConversationStreamBuffer.swift
      - Apps/MiraMac/Presentation/ConversationReadingState.swift
      - Apps/MiraMac/Presentation/TranscriptScrollState.swift
      - Apps/MiraMac/Presentation/NativeTranscriptState.swift
      - Apps/MiraMac/Features/Conversation/NativeTranscriptRow.swift
      - Apps/MiraMac/Features/Conversation/MessageRow.swift
      - Apps/MiraMac/DesignSystem/MiraMarkdownView.swift
      - Apps/MiraMac/DesignSystem/MiraTheme.swift
      - Apps/MiraMac/DesignSystem/MiraComponents.swift
      - Apps/MiraMac/DesignSystem/MiraSettingsComponents.swift
      - Apps/MiraMac/DesignSystem/MiraBrandMark.swift
      - Apps/MiraMac/Features/Workspace/WorkspaceEditor.swift
      - Apps/MiraMac/Features/Conversation/UsageCostView.swift
      - Apps/MiraMac/Localization
      - Apps/MiraMac/Resources/Localizable.xcstrings
      - Tests/MiraPlatformTests/KeychainTests.swift
      - Tests/MiraPlatformTests/ConversationStreamBufferTests.swift
      - Tests/MiraPlatformTests/NativeTranscriptStateTests.swift
      - Tests/MiraPlatformTests/NativeTranscriptRowTests.swift
      - Tests/MiraSettingsTests/WorkspaceEditorModelTests.swift
      - Tests/MiraLocalizationTests/CostPresentationTests.swift
      - Tests/MiraCompositionTests
      - Tests/MiraTestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alwynou.mira.composition-tests
    dependencies:
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXEmbedders
      - package: MLXLM
        product: MLXLMCommon
      - package: Transformers
        product: Tokenizers
      - package: MarkdownView
        product: MarkdownView
      - package: MarkdownView
        product: Litext
      - package: ListViewKit
        product: ListViewKit
      - package: MiraKit
        product: MiraCore
      - package: MiraKit
        product: MiraData
      - package: MiraKit
        product: MiraProviders
  MiraHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Apps/MiraMac/Composition/MacDemoModule.swift
      - Apps/MiraMac/Composition/MacLibrary.swift
      - Apps/MiraMac/Composition/MacLibraryStorage.swift
      - Apps/MiraMac/Composition/MacLibraryRestoration.swift
      - Apps/MiraMac/Composition/MacLibrarySelection.swift
      - Apps/MiraMac/Composition/MacLibraryDiagnostics.swift
      - Apps/MiraMac/Composition/MacLibraryWorkloads.swift
      - Apps/MiraMac/Composition/MacConnectionTestService.swift
      - Apps/MiraMac/Localization
      - Apps/MiraMac/App/MiraWindowShell.swift
      - Apps/MiraMac/App/AppDisplayMode.swift
      - Apps/MiraMac/DesignSystem/MiraTheme.swift
      - Apps/MiraMac/DesignSystem/MiraBrandMark.swift
      - Apps/MiraMac/DesignSystem/MiraComponents.swift
      - Apps/MiraMac/DesignSystem/MiraSettingsComponents.swift
      - Apps/MiraMac/DesignSystem/MiraModelIcon.swift
      - Apps/MiraMac/DesignSystem/MiraProviderModelRow.swift
      - Apps/MiraMac/Presentation/ProviderConnectionSettingsModel.swift
      - Apps/MiraMac/Presentation/WorkspaceEditorModel.swift
      - Apps/MiraMac/Features/Settings/Configuration/ProviderConnectionEditor.swift
      - Apps/MiraMac/Presentation/ProviderConnectionTestModel.swift
      - Apps/MiraMac/Presentation/ConversationModel.swift
      - Apps/MiraMac/Presentation/ConversationModelPreferences.swift
      - Apps/MiraMac/Presentation/ConversationPageState.swift
      - Tests/MiraSettingsTests
      - Apps/MiraMac/Features/Conversation/NativeTranscriptRow.swift
      - Apps/MiraMac/Features/Conversation/MessageRow.swift
      - Apps/MiraMac/Resources/Localizable.xcstrings
      - Tests/MiraLocalizationTests
      - Tests/MiraPlatformTests
      - Tests/MiraTestSupport
      - path: Tests/Fixtures/EverydayMemory/scenarios.json
        buildPhase: resources
      - path: Tests/Fixtures/EverydayMemory/state-evolution.json
        buildPhase: resources
      - Apps/MiraMac/Platform/Keychain
      - Apps/MiraMac/Platform/MemoryEmbedding
      - Apps/MiraMac/Presentation/ConversationStreamBuffer.swift
      - Apps/MiraMac/Presentation/TranscriptViewportLayout.swift
      - Apps/MiraMac/Presentation/TranscriptScrollState.swift
      - Apps/MiraMac/Presentation/ConversationReadingState.swift
      - Apps/MiraMac/Presentation/TranscriptFollowScheduler.swift
      - Apps/MiraMac/Presentation/SourceCitationModel.swift
      - Apps/MiraMac/Presentation/MacSessionReadModel.swift
      - Apps/MiraMac/Features/Conversation/UsageCostView.swift
      - Apps/MiraMac/DesignSystem/MiraMarkdownView.swift
      - Apps/MiraMac/Presentation/NativeTranscriptState.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alwynou.mira.host-tests
    dependencies:
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXEmbedders
      - package: MLXLM
        product: MLXLMCommon
      - package: Transformers
        product: Tokenizers
      - package: MiraKit
        product: MiraCore
      - package: MiraKit
        product: MiraData
      - package: MiraKit
        product: MiraProviders
      - package: MarkdownView
        product: MarkdownView
      - package: MarkdownView
        product: MarkdownParser
      - package: ListViewKit
        product: ListViewKit
      - package: Litext
        product: Litext
  MiraUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/MiraUITests
      - path: Tests/Fixtures/EverydayMemory/scenarios.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alwynou.mira.ui-tests
        TEST_TARGET_NAME: Mira
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: Mira
schemes:
  MiraCompositionTests:
    build:
      targets:
        MiraCompositionTests: [test]
    test:
      targets: [MiraCompositionTests]
      config: Debug
  MiraHostTests:
    build:
      targets:
        MiraHostTests: [test]
    test:
      targets: [MiraHostTests, MiraCompositionTests]
      config: Debug
  MiraUI:
    build:
      targets:
        Mira: all
        MiraUITests: [test]
    test:
      targets: [MiraUITests]
      config: Debug
  Mira:
    build:
      targets:
        Mira: all
    run:
      config: Debug
    test:
      targets: [MiraHostTests, MiraCompositionTests]
    archive:
      config: Release
