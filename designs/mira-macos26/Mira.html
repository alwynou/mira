<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mira · macOS 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
  /* ============================================================
     Mira — macOS 26 (Tahoe / Liquid Glass) native two-column UI
     Restrained native + micro-glass. Black / white / graphite.
     ============================================================ */

  :root {
    color-scheme: light;

    /* type */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", monospace;

    /* neutral ink scale (light) */
    --ink: #1d1d1f;
    --text: rgba(0, 0, 0, 0.86);
    --text-2: rgba(0, 0, 0, 0.52);
    --text-3: rgba(0, 0, 0, 0.34);
    --text-4: rgba(0, 0, 0, 0.24);

    --hairline: rgba(0, 0, 0, 0.09);
    --hairline-2: rgba(0, 0, 0, 0.055);
    --hairline-strong: rgba(0, 0, 0, 0.15);

    --fill-hover: rgba(0, 0, 0, 0.045);
    --fill-active: rgba(0, 0, 0, 0.075);
    --sel: rgba(0, 0, 0, 0.075);
    --sel-strong: rgba(0, 0, 0, 0.9);

    /* window / surfaces */
    --wallpaper: radial-gradient(95% 85% at 16% 6%, #f0eff4 0%, #e0dfe6 38%, #cccdd6 72%, #bcbec9 100%);
    --sidebar-bg: rgba(244, 245, 249, 0.55);
    --sidebar-bg-solid: #f4f4f6;
    --sb-highlight: rgba(255, 255, 255, 0.6);
    --content-bg: #ffffff;
    --content-bg-2: #fbfbfc;
    --group-bg: #eeeef2; /* grouped-settings backdrop; panels sit on top as cards */

    /* glass material (popovers / inspector / sheets / composer) */
    --glass: rgba(255, 255, 255, 0.7);
    --glass-strong: rgba(255, 255, 255, 0.82);
    --glass-border: rgba(255, 255, 255, 0.55);
    --glass-hairline: rgba(0, 0, 0, 0.08);

    /* the single restrained accent = ink; blue only for focus rings */
    --accent: #1d1d1f;
    --accent-text: #ffffff;
    --focus: #0a84ff;
    --focus-ring: rgba(10, 132, 255, 0.5);

    /* semantic tints (very muted, used tiny) */
    --tint-blue: #2f6bd6;
    --tint-green: #268a52;
    --tint-amber: #a9791d;
    --tint-red: #c0392f;

    /* radii — macOS 26 concentric, generous */
    --r-window: 13px;
    --r-lg: 14px;
    --r-md: 10px;
    --r-sm: 7px;
    --r-pill: 999px;

    /* elevation */
    --sh-pop: 0 1px 1px rgba(0, 0, 0, 0.04), 0 12px 34px rgba(0, 0, 0, 0.18),
      0 0 0 0.5px rgba(0, 0, 0, 0.12);
    --sh-sheet: 0 30px 80px rgba(0, 0, 0, 0.34), 0 0 0 0.5px rgba(0, 0, 0, 0.14);
    --sh-window: 0 0 0 0.5px rgba(0, 0, 0, 0.28), 0 24px 70px rgba(0, 0, 0, 0.4),
      0 60px 130px rgba(0, 0, 0, 0.28);
    --sh-composer: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.1),
      0 0 0 0.5px rgba(0, 0, 0, 0.1);

    --dur: 0.22s;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    /* softened so bright white text isn't harsh on the dark ground */
    --ink: #dedee3;
    --text: rgba(235, 235, 240, 0.8);
    --text-2: rgba(235, 235, 240, 0.5);
    --text-3: rgba(235, 235, 240, 0.32);
    --text-4: rgba(235, 235, 240, 0.2);

    --hairline: rgba(255, 255, 255, 0.1);
    --hairline-2: rgba(255, 255, 255, 0.06);
    --hairline-strong: rgba(255, 255, 255, 0.18);

    --fill-hover: rgba(255, 255, 255, 0.06);
    --fill-active: rgba(255, 255, 255, 0.1);
    --sel: rgba(255, 255, 255, 0.11);
    --sel-strong: rgba(255, 255, 255, 0.92);

    --wallpaper: radial-gradient(95% 85% at 16% 6%, #34353d 0%, #262730 38%, #191a20 72%, #0e0f13 100%);
    --sidebar-bg: rgba(32, 32, 37, 0.5);
    --sidebar-bg-solid: #262629;
    --sb-highlight: rgba(255, 255, 255, 0.07);
    --content-bg: #1d1d20;
    --content-bg-2: #202024;
    --group-bg: #16161a; /* darker backdrop so panels read as raised cards */

    --glass: rgba(46, 46, 50, 0.66);
    --glass-strong: rgba(50, 50, 54, 0.8);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-hairline: rgba(255, 255, 255, 0.09);

    --accent: #f5f5f7;
    --accent-text: #1d1d1f;
    --focus: #0a84ff;

    --tint-blue: #7aa7f0;
    --tint-green: #5fc98d;
    --tint-amber: #e0b45a;
    --tint-red: #f0817a;

    --sh-pop: 0 1px 1px rgba(0, 0, 0, 0.3), 0 12px 34px rgba(0, 0, 0, 0.5),
      0 0 0 0.5px rgba(255, 255, 255, 0.09);
    --sh-sheet: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(255, 255, 255, 0.1);
    --sh-window: 0 0 0 0.5px rgba(0, 0, 0, 0.6), 0 24px 70px rgba(0, 0, 0, 0.6),
      0 60px 140px rgba(0, 0, 0, 0.5);
    --sh-composer: 0 2px 6px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    background: var(--wallpaper);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 13.5px;
    line-height: 1.45;
    overflow: hidden;
  }
  [lang="zh"], .cjk { line-height: 1.72; }

  button { font-family: inherit; color: inherit; }
  ::selection { background: rgba(10, 132, 255, 0.22); }

  /* thin native scrollbars */
  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, 0); border-radius: 999px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  .scroll:hover::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.4); background-clip: padding-box; }

  :focus-visible { outline: 2.5px solid var(--focus-ring); outline-offset: 1px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #root { height: 100%; }
</style>
