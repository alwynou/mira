<style>
  /* ============================================================
     Mira — macOS 26 (Tahoe / Liquid Glass) native two-column UI
     Restrained native + micro-glass. Black / white / graphite.
     ============================================================ */

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    background: var(--wallpaper);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: var(--font-body);
    font-weight: var(--weight-normal);
    line-height: var(--line-ui);
    overflow: hidden;
  }
  [lang="zh"], .cjk { line-height: var(--line-reading); }

  button, input, select, textarea { font-family: inherit; font-size: inherit; line-height: var(--line-ui); color: inherit; }
  b, strong { font-weight: var(--weight-strong); }
  ::selection { background: color-mix(in srgb, var(--focus-ring) 44%, transparent); }

  /* thin native scrollbars */
  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll::-webkit-scrollbar-thumb {
    background: transparent; border-radius: var(--r-pill);
    border: 3px solid transparent; background-clip: padding-box;
  }
  .scroll:hover::-webkit-scrollbar-thumb { background: var(--scroll-thumb); background-clip: padding-box; }

  :focus-visible { outline: 2.5px solid var(--focus-ring); outline-offset: 1px; border-radius: var(--r-sm); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #root { height: 100%; }
</style>
