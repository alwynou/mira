name: MemoryEmbeddingPrototype
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    ARCHS: arm64
packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
targets:
  MemoryEmbeddingPrototype:
    type: tool
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXEmbedders
      - package: MLXLM
        product: MLXLMCommon
      - package: Transformers
        product: Tokenizers
      - sdk: libsqlite3.tbd
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.mira.MemoryEmbeddingPrototype
schemes:
  MemoryEmbeddingPrototype:
    build:
      targets:
        MemoryEmbeddingPrototype: all
    run:
      config: Release
